<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Склад кондитера демо</title>
<meta name="description" content="Демо интернет-магазина кондитерского сырья: фасовки от килограмма до мешка, оптовые цены для кондитерских, повтор заказа.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#FBF5F2; --paper:#FFFFFF; --ink:#3A2219; --ink-2:#7A5E53; --line:#EFE2DC;
  --blush:#F8E1E3; --blush-2:#F2CDD2;
  --rasp:#C3355D; --rasp-deep:#A82A4E; --on-rasp:#FFFFFF;
  --pist:#DDEBC2; --pist-ink:#4E6B1F;
  --choc:#4A2A1F; --ok:#4E7A22;
  --shadow:0 14px 34px -18px rgba(122,62,70,.45);
  --r:16px;
  --f-display:"Yeseva One", Georgia, serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1B1316; --paper:#241A1D; --ink:#F6E9EA; --ink-2:#C6ABAE; --line:#3A2B2F;
    --blush:#2E1F23; --blush-2:#3E2A30; --rasp:#E0557D; --rasp-deep:#C9446B;
    --pist:#33401F; --pist-ink:#C9E39A; --choc:#F6E9EA; --ok:#9BCB6A;
    --shadow:0 14px 34px -18px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#1B1316; --paper:#241A1D; --ink:#F6E9EA; --ink-2:#C6ABAE; --line:#3A2B2F;
  --blush:#2E1F23; --blush-2:#3E2A30; --rasp:#E0557D; --rasp-deep:#C9446B;
  --pist:#33401F; --pist-ink:#C9E39A; --choc:#F6E9EA; --ok:#9BCB6A;
  --shadow:0 14px 34px -18px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--rasp);outline-offset:2px;border-radius:8px}
.wrap{max-width:1220px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 16px}}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.demo{background:var(--choc);color:#F3DDE0;font-size:13px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .demo{background:#120C0E}}
.demo .wrap{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:36px}
.demo b{color:#F7B9C8;font-weight:800}
.langs{display:flex;gap:2px}
.langs button{background:none;border:0;color:#F3DDE0;padding:6px 10px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px}
.langs button[aria-pressed="true"]{background:#F7B9C8;color:#3A2219}

header.top{background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:26px;height:70px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none}
.brand b{font:400 24px/1 var(--f-display);color:var(--ink)}
.brand small{display:block;font-size:11px;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;font-weight:700}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:999px;background:var(--ground);color:var(--ink);padding:11px 16px 11px 42px;font-size:15px}
.search input::placeholder{color:var(--ink-2)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.cartbtn{margin-left:auto;display:flex;gap:10px;align-items:center;border:0;border-radius:999px;background:var(--rasp);color:var(--on-rasp);padding:11px 16px;font-weight:800;cursor:pointer}
.cartbtn .count{background:#fff;color:var(--rasp);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px;padding:0 7px}
@media (max-width:760px){.search{display:none}.cartbtn .lbl{display:none}.brand b{font-size:19px;white-space:nowrap}.sacks{height:220px}}

.hero{background:var(--blush);overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:28px;background:radial-gradient(circle at 14px -4px,transparent 16px,var(--ground) 17px) repeat-x;background-size:28px 28px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:30px;padding-top:58px;padding-bottom:44px;align-items:center}
.hero h1{font:400 clamp(40px,5.2vw,70px)/1.04 var(--f-display);margin:0 0 18px;text-wrap:balance;color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--rasp)}
.hero p.lead{color:var(--ink-2);font-size:18.5px;max-width:46ch;margin:0 0 26px}
.who{display:inline-flex;background:var(--paper);border-radius:20px;padding:6px;gap:4px;margin-bottom:14px;box-shadow:var(--shadow)}
.who button{border:0;background:none;color:var(--ink);padding:11px 18px;border-radius:15px;font-weight:800;cursor:pointer;text-align:left;line-height:1.2}
.who button small{display:block;font-weight:600;font-size:12.5px;color:var(--ink-2);margin-top:3px}
.who button[aria-pressed="true"]{background:var(--rasp);color:var(--on-rasp)}
.who button[aria-pressed="true"] small{color:#FBD9E2}
.perks{display:flex;flex-wrap:wrap;gap:8px 22px;margin:14px 0 20px;padding:0;list-style:none;color:var(--ink-2);font-size:15px;font-weight:600}
.perks li{display:flex;gap:8px;align-items:center}
.perks li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rasp)}
.sacks{position:relative;height:420px}
.sacks svg{position:absolute;right:-10px;top:50%;transform:translateY(-54%);width:580px;max-width:none;height:auto}
@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr;padding-top:34px;padding-bottom:40px}
  .sacks{height:250px;order:-1}
  .sacks svg{width:330px;right:50%;top:auto;bottom:-20px;transform:translateX(50%)}
}

.cats{background:var(--ground);position:sticky;top:70px;z-index:20}
.cats .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:14px;padding-bottom:12px}
.cats .wrap::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--paper);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap}
.cats button span{font-weight:600;color:var(--ink-2);margin-left:5px;font-size:13px}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cats button[aria-pressed="true"] span{color:var(--blush-2)}

.main{padding:26px 0 70px}
.maingrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;align-items:start}
@media (max-width:1020px){.maingrid{grid-template-columns:1fr}}
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.listhead h2{font:400 34px/1.1 var(--f-display);margin:0}
.listhead .note{color:var(--ink-2);font-size:14px;font-weight:600}
.prow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:8px 22px;padding:22px 0;border-bottom:1px solid var(--line);align-items:start}
.prow .th{width:76px;height:76px}
.pinfo small{display:block;font:800 11.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--rasp);margin-bottom:6px}
.pinfo h3{margin:0;font-size:18.5px;font-weight:800;line-height:1.3}
.pinfo .spec{color:var(--ink-2);font-size:14.5px;margin-top:3px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tags span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--pist);color:var(--pist-ink)}
.ladder{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ladder button{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 13px;cursor:pointer;text-align:left;min-width:108px;transition:border-color .2s,background .2s}
.ladder button:hover{border-color:var(--blush-2)}
.ladder button b{display:block;font:800 16px/1.1 var(--f-body)}
.ladder button span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;font-weight:600}
.ladder button[aria-pressed="true"]{border-color:var(--rasp);background:var(--rasp);color:var(--on-rasp)}
.ladder button[aria-pressed="true"] span{color:#FBD9E2}
.pbuy{text-align:right;min-width:170px}
.pbuy .pr{font:400 28px/1 var(--f-display)}
.pbuy .unit{font-size:13px;color:var(--ink-2);margin-top:6px;font-weight:600}
.pbuy .save{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:800;color:var(--ok);min-height:18px}
.pbuy .ctl{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.qty button{border:0;background:none;width:34px;height:42px;cursor:pointer;font-size:18px;font-weight:700}
.qty span{min-width:20px;text-align:center;font-weight:800}
.add{border:0;border-radius:999px;background:var(--rasp);color:var(--on-rasp);font-weight:800;padding:0 18px;height:44px;cursor:pointer;white-space:nowrap}
.add:hover{background:var(--rasp-deep)}
.add.done{background:var(--pist);color:var(--pist-ink)}
@media (max-width:640px){
  .prow{grid-template-columns:56px 1fr}
  .prow .th{width:56px;height:56px}
  .pbuy{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;text-align:left;flex-wrap:wrap;gap:8px}
  .pbuy .ctl{margin-top:0}
  .ladder{margin-left:-78px}
  .ladder button{min-width:0;flex:1;padding:8px 9px}
  .ladder button span{white-space:nowrap;font-size:12px}
}
.emptyl{padding:30px 0;color:var(--ink-2)}

aside.side{position:sticky;top:140px;display:flex;flex-direction:column;gap:16px}
.box{background:var(--paper);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.box h3{margin:0 0 4px;font:400 22px/1.2 var(--f-display)}
.box p{margin:0 0 12px;color:var(--ink-2);font-size:14px}
.reorder li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-top:1px dashed var(--line)}
.reorder ul{list-style:none;margin:0 0 14px;padding:0}
.reorder li span:last-child{color:var(--ink-2);white-space:nowrap;font-weight:600}
.btn2{width:100%;border:0;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:800;padding:13px;cursor:pointer}
.btn2.done{background:var(--pist);color:var(--pist-ink)}
.deliv{list-style:none;margin:0;padding:0;font-size:14px}
.deliv li{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.deliv li:first-child{border-top:0}
.deliv li span:last-child{font-weight:800;white-space:nowrap}
@media (max-width:1020px){aside.side{position:static}}

footer{background:var(--blush);color:var(--ink-2);padding:36px 0 50px;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 40px}
footer p{margin:0;max-width:64ch}
footer a{color:var(--rasp);font-weight:700}

.scrim{position:fixed;inset:0;background:rgba(58,34,25,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{visibility:hidden;position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--paper);z-index:50;transform:translateX(100%);transition:transform .45s cubic-bezier(.16,1,.3,1),visibility 0s linear .45s;display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.3)}
.drawer.on{visibility:visible;transform:none;transition:transform .45s cubic-bezier(.16,1,.3,1)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font:400 26px/1 var(--f-display)}
.x{border:0;background:var(--ground);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px}
.dbody{flex:1;overflow:auto;padding:6px 22px 20px}
.ci{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.ci .th{width:44px;height:44px}
.ci b{display:block;font-size:14.5px;font-weight:800}
.ci small{color:var(--ink-2);font-weight:600}
.ci .rm{background:none;border:0;padding:0;margin-top:3px;font-size:13px;color:var(--ink-2);text-decoration:underline;cursor:pointer}
.ci .sum{font-weight:800}
.opt{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.opt input{width:19px;height:19px;margin-top:2px;accent-color:var(--rasp)}
.opt small{display:block;color:var(--ink-2)}
.dfoot{padding:16px 22px 22px;border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot b{font:400 32px/1 var(--f-display)}
.vat{font-size:13px;color:var(--ink-2);margin:4px 0 14px}
.go{width:100%;border:0;border-radius:999px;background:var(--rasp);color:var(--on-rasp);font-weight:800;font-size:16px;padding:16px;cursor:pointer}
.thanks{background:var(--pist);color:var(--pist-ink);border-radius:14px;padding:14px;margin-top:12px;font-size:14px;font-weight:700}
.emptyc{padding:28px 0;color:var(--ink-2)}
</style>
</head>
<body>

<div class="demo"><div class="wrap">
  <span><b>ДЕМО</b> · <span data-i18n="demo"></span></span>
  <div class="langs" role="group" aria-label="Язык"><button data-lang="ru">RU</button><button data-lang="et">ET</button></div>
</div></div>

<header class="top"><div class="wrap">
  <a class="brand" href="#">
    <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><ellipse cx="18" cy="12" rx="13" ry="6.5" fill="#F2A7B8"/><rect x="6" y="15" width="24" height="5" rx="2.5" fill="#FFF3E6"/><ellipse cx="18" cy="24" rx="13" ry="6.5" fill="#F2A7B8"/></svg>
    <div><b data-i18n="brand"></b><small data-i18n="logoHere"></small></div>

  <label class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" autocomplete="off"></label>
  <button class="cartbtn" id="openCart"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 4h2.5l2.2 11h10.6L21 7H7"/><circle cx="9.5" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span class="lbl" data-i18n="cart"></span><span class="count num" id="cartCount">0</span></button>
</div></header>

<section class="hero"><div class="wrap">
  <div>
    <h1 id="h1"></h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="who" role="group" id="who">
      <button data-who="pro"><span data-i18n="pro"></span><small data-i18n="proSub"></small></button>
      <button data-who="home"><span data-i18n="home"></span><small data-i18n="homeSub"></small></button>

</div></section>

<nav class="cats" aria-label="Категории"><div class="wrap" id="cats"></div></nav>

<div class="main"><div class="wrap maingrid">
  <section>
    <div class="listhead"><h2 id="catTitle"></h2><span class="note" id="priceNote"></span></div>
    <div id="list"></div>
  </section>
  <aside class="side">
    <div class="box reorder">
      <h3 data-i18n="reH"></h3>
      <p data-i18n="reP"></p>
      <ul id="reList"></ul>
      <button class="btn2" id="reBtn"></button>
    </div>
    <div class="box">
      <h3 data-i18n="delH"></h3>
      <ul class="deliv" id="deliv"></ul>
    </div>
  </aside>
</div></div>

<footer><div class="wrap">
  <p data-i18n="foot"></p>
  <p><span data-i18n="madeBy"></span> <a href="https://jukamedia.com" target="_blank" rel="noopener">Juka Media</a></p>
</div></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dT" aria-hidden="true">
  <div class="dh"><h2 id="dT" data-i18n="cart"></h2><button class="x" id="closeCart" aria-label="Закрыть">×</button></div>
  <div class="dbody" id="dbody"></div>
  <div class="dfoot" id="dfoot"></div>
</aside>

  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.getElementById("h1").innerHTML=t("h1");
  document.getElementById("q").placeholder=t("search");
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.querySelectorAll("#who button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.who===state.who));
  const dl=[["d1","d1v"],["d2","d2v"],["d3","d3v"],["d4","d4v"]];
  document.getElementById("deliv").innerHTML=dl.map(([a,b])=>`<li><span>${t(a)}</span><span>${t(b)}</span></li>`).join("");
  buildSacks(); renderCats(); renderList(); renderRe(); renderCart();
}
function renderCats(){
  const box=document.getElementById("cats");
  box.innerHTML=CATS.map(c=>{const n=c==="all"?P.length:P.filter(p=>p.cat===c).length;return `<button data-c="${c}" aria-pressed="${state.cat===c}">${t(c)}<span class="num">${n}</span></button>`}).join("");
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{state.cat=b.dataset.c;renderCats();renderList()});
}
function unitLbl(pr,q){return pr.u==="kg"? (q<1? (q*1000)+" g" : q+" "+t("kg")) : q+" "+t("pcs")}
function renderList(){
  const q=state.q.trim().toLowerCase();
  let L=P.filter(p=>(state.cat==="all"||p.cat===state.cat)&&(!q||(p.ru+" "+p.et+" "+p.brand).toLowerCase().includes(q)));
  document.getElementById("catTitle").textContent=q?`«${state.q}»`:t(state.cat);
  document.getElementById("priceNote").textContent=`${t("found",{n:L.length})} · ${state.who==="pro"?t("priceB2B"):t("priceB2C")}`;
  const list=document.getElementById("list");
  if(!L.length){list.innerHTML=`<p class="emptyl">${t("empty")}</p>`;return}
  list.innerHTML=L.map(pr=>{
    const sel=state.sel[pr.id]??(state.who==="pro"?pr.tiers.length-1:0);
    const qty=state.qty[pr.id]??1;
    const inCart=state.cart.some(c=>c.id===pr.id);
    const tags=(pr.tags||[]).map(k=>`<span>${TAGS[lang][k]}</span>`).join("");
    const ladder=pr.tiers.map((tr,i)=>`<button data-id="${pr.id}" data-tier="${i}" aria-pressed="${i===sel}"><b class="num">${unitLbl(pr,tr[0])}</b><span class="num">${eur(unitPrice(pr,i))}${pr.u==="kg"?t("perKgShort"):t("perPcShort")}</span></button>`).join("");
    return `<article class="prow" id="row-${pr.id}">
      ${thumb(pr.cat)}
      <div class="pinfo"><small>${pr.brand}</small><h3>${pr[lang]}</h3><div class="spec">${lang==="ru"?pr.sru:pr.set}</div>${tags?`<div class="tags">${tags}</div>`:""}<div class="ladder" role="group">${ladder}</div></div>
      <div class="pbuy" id="buy-${pr.id}">${buyHtml(pr,sel,qty,inCart)}</div>
    </article>`}).join("");
  list.querySelectorAll(".ladder button").forEach(b=>b.onclick=()=>{
    const pr=P.find(x=>x.id===b.dataset.id); const prev=state.sel[pr.id]??(state.who==="pro"?pr.tiers.length-1:0);
    state.sel[pr.id]=+b.dataset.tier;
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    const box=document.getElementById("buy-"+pr.id);
    box.innerHTML=buyHtml(pr,state.sel[pr.id],state.qty[pr.id]??1,state.cart.some(c=>c.id===pr.id));
    tick(box.querySelector(".pr"),packPrice(pr,prev),packPrice(pr,state.sel[pr.id]));
    wireBuy(box,pr);
  });
  L.forEach(pr=>wireBuy(document.getElementById("buy-"+pr.id),pr));
}
const packPrice=(pr,i)=>unitPrice(pr,i)*pr.tiers[i][0];
function buyHtml(pr,sel,qty,inCart){
  const up=unitPrice(pr,sel), base=unitPrice(pr,0), amt=pr.tiers[sel][0];
  const saving=(base-up)*amt;
  const saveTxt=sel>0&&saving>0.5? t(pr.u==="kg"?"save":"savePc",{p:eur(saving)}) : "";
  return `<div class="pr num">${eur(up*amt)}</div>
    <div class="unit num">${unitLbl(pr,amt)} · ${t(pr.u==="kg"?"perKg":"perPc",{p:eur(up)})}</div>
    <span class="save">${saveTxt}</span>
    <div class="ctl"><div class="qty"><button data-q="-1" aria-label="−">−</button><span class="num">${qty}</span><button data-q="1" aria-label="+">+</button></div>
    <button class="add ${inCart?"done":""}">${inCart?t("added"):t("add")}</button></div>`;
}
function wireBuy(box,pr){
  box.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{state.qty[pr.id]=Math.max(1,Math.min(20,(state.qty[pr.id]??1)+ +b.dataset.q));box.querySelector(".qty span").textContent=state.qty[pr.id]});
  box.querySelector(".add").onclick=e=>{
    const sel=state.sel[pr.id]??(state.who==="pro"?pr.tiers.length-1:0), qty=state.qty[pr.id]??1;
    const ex=state.cart.find(c=>c.id===pr.id); if(ex){ex.tier=sel;ex.qty=qty}else state.cart.push({id:pr.id,tier:sel,qty});
    state.ordered=false; e.target.classList.add("done"); e.target.textContent=t("added"); renderCart(); bump();
  };
}
function tick(el,from,to){
  if(!el||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const t0=performance.now(),d=550;
  const step=n=>{const k=Math.min(1,(n-t0)/d);const e=1-Math.pow(1-k,4);el.textContent=eur(from+(to-from)*e);if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function bump(){document.getElementById("cartCount").animate([{transform:"scale(1)"},{transform:"scale(1.35)"},{transform:"scale(1)"}],{duration:450,easing:"cubic-bezier(.16,1,.3,1)"})}

const RE=[["c54",2,1],["t55",2,2],["pud",1,1],["box",1,1]];
function renderRe(){
  document.getElementById("reList").innerHTML=RE.map(([id,tier,q])=>{const pr=P.find(p=>p.id===id);return `<li><span>${pr[lang]}</span><span class="num">${q} × ${unitLbl(pr,pr.tiers[tier][0])}</span></li>`}).join("");
  const b=document.getElementById("reBtn"); b.textContent=state.reDone?t("reDone"):t("reBtn"); b.classList.toggle("done",state.reDone);
  b.onclick=()=>{RE.forEach(([id,tier,q])=>{const ex=state.cart.find(c=>c.id===id);if(ex){ex.tier=tier;ex.qty=q}else state.cart.push({id,tier,qty:q})});state.reDone=true;state.ordered=false;renderRe();renderCart();renderList();bump()};
}

function renderCart(){
  const items=state.cart.map(c=>{const pr=P.find(p=>p.id===c.id);return {...c,pr,line:packPrice(pr,c.tier)*c.qty}});
  document.getElementById("cartCount").textContent=items.reduce((a,b)=>a+b.qty,0);
  const body=document.getElementById("dbody"),foot=document.getElementById("dfoot");
  if(!items.length){body.innerHTML=`<p class="emptyc">${t("cartEmpty")}</p>`;foot.innerHTML="";return}
  const sub=items.reduce((a,b)=>a+b.line,0);
  const ship=state.delivery?(sub>=(state.who==="pro"?150/1.24:150)?0:(state.who==="pro"?7/1.24:7)):0;
  const net=sub+ship;
  body.innerHTML=items.map(x=>`<div class="ci">${thumb(x.pr.cat)}<div><b>${x.pr[lang]}</b><small class="num">${x.qty} × ${unitLbl(x.pr,x.pr.tiers[x.tier][0])}</small><br><button class="rm" data-rm="${x.id}">${t("remove")}</button></div><div class="sum num">${eur(x.line)}</div></div>`).join("")+
   `<label class="opt"><input type="checkbox" id="dl" ${state.delivery?"checked":""}><div><b>${t("delivery")}</b><small>${t("deliverySub")}</small></div></label>`+
   (state.who==="pro"?`<label class="opt"><input type="checkbox" id="inv" ${state.invoice?"checked":""}><div><b>${t("invoice")}</b><small>${t("invoiceSub")}</small></div></label>`:"")+
   (state.ordered?`<div class="thanks">${t("thanks")}</div>`:"");
  let total,vatLine;
  if(state.who==="pro"){total=net*1.24;vatLine=t("vatExcl",{a:eur(net),v:eur(net*0.24)})}
  else{total=net;vatLine=t("vatIncl",{v:eur(net*24/124)})}
  foot.innerHTML=`<div class="tot"><span>${t("total")}</span><b class="num">${eur(total)}</b></div><div class="vat num">${vatLine}</div><button class="go" id="checkout">${t("checkout")}</button>`;
  body.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{state.cart=state.cart.filter(c=>c.id!==b.dataset.rm);renderCart();renderList()});
  document.getElementById("dl").onchange=e=>{state.delivery=e.target.checked;renderCart()};
  const inv=document.getElementById("inv"); if(inv) inv.onchange=e=>{state.invoice=e.target.checked};
  document.getElementById("checkout").onclick=()=>{state.ordered=true;renderCart()};
}

const drawer=document.getElementById("drawer"),scrim=document.getElementById("scrim");let lastF=null;
function openCart(){lastF=document.activeElement;drawer.classList.add("on");scrim.classList.add("on");drawer.setAttribute("aria-hidden","false");document.getElementById("closeCart").focus()}
function closeCart(){drawer.classList.remove("on");scrim.classList.remove("on");drawer.setAttribute("aria-hidden","true");if(lastF)lastF.focus()}
document.getElementById("openCart").onclick=openCart;document.getElementById("closeCart").onclick=closeCart;scrim.onclick=closeCart;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&drawer.classList.contains("on"))closeCart()});
document.querySelectorAll("#who button").forEach(b=>b.onclick=()=>{state.who=b.dataset.who;state.sel={};applyStatic()});
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("kd-lang",lang)}catch(e){};applyStatic()});
document.getElementById("q").oninput=e=>{state.q=e.target.value;renderList()};
applyStatic();
</script>
</body>
</html>
