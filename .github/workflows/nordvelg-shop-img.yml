name: nordvelg-shop-img
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['nordvelg/tools/shop_images.json', 'nordvelg/tools/fetch_shop_images.py', '.github/workflows/nordvelg-shop-img.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q imagemagick webp
      - run: python3 nordvelg/tools/fetch_shop_images.py
      - run: |
          git config user.name "nordvelg-bot"; git config user.email "auppost@gmail.com"
          git add nordvelg/img/shop
          git diff --cached --quiet || (git commit -m "Nordvelg: shop photos [skip ci]" && git pull --rebase -q && git push)
