name: nordvelg-shop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/nordvelg-shop.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p nordvelg/tools/raw/shop
          for p in $(seq 1 40); do
            curl -sSL -A "Mozilla/5.0 (Nordvelg catalog sync)" --max-time 60 -o nordvelg/tools/raw/shop/p$p.json "https://baanvelgen.com/products.json?limit=250&page=$p"
            n=$(python3 -c "import json;print(len(json.load(open('nordvelg/tools/raw/shop/p$p.json'))['products']))" 2>/dev/null || echo 0)
            echo "page $p: $n"
            [ "$n" = "0" ] && rm -f nordvelg/tools/raw/shop/p$p.json && break
            sleep 1
          done
          curl -sSL -A "Mozilla/5.0" -o nordvelg/tools/raw/shop/collections.json "https://baanvelgen.com/collections.json?limit=250"
          python3 - <<'PY'
          import json,glob
          ps=[]
          for f in sorted(glob.glob('nordvelg/tools/raw/shop/p*.json')): ps+=json.load(open(f))['products']
          # compact: drop body_html to keep repo small, keep a short text
          import re
          for p in ps:
              b=re.sub(r'<[^>]+>',' ',p.get('body_html') or ''); p['body']=re.sub(r'\s+',' ',b).strip()[:3000]; p.pop('body_html',None)
              p['images']=[{'src':i['src'],'w':i.get('width'),'h':i.get('height')} for i in p.get('images',[])[:6]]
              p['variants']=[{k:v.get(k) for k in ('title','price','compare_at_price','sku','option1','option2','option3','available')} for v in p.get('variants',[])[:300]]
          json.dump(ps,open('nordvelg/tools/raw/shop/all.json','w'))
          for f in glob.glob('nordvelg/tools/raw/shop/p*.json'): __import__('os').remove(f)
          print(len(ps),'products')
          PY
      - run: |
          git config user.name "nordvelg-bot"; git config user.email "auppost@gmail.com"
          git add nordvelg/tools/raw/shop
          git diff --cached --quiet || (git commit -m "Nordvelg: Baan shop export [skip ci]" && git pull --rebase -q && git push)
