name: nordvelg-images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['nordvelg/tools/images.json', 'nordvelg/tools/fetch_images.py', '.github/workflows/nordvelg-images.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q imagemagick webp
      - run: python3 nordvelg/tools/fetch_images.py
      - run: |
          git config user.name "nordvelg-bot"
          git config user.email "auppost@gmail.com"
          git add nordvelg/img nordvelg/tools/images-manifest.json
          git diff --cached --quiet || (git commit -m "Nordvelg: sync images [skip ci]" && git push)
