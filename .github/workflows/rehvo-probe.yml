name: rehvo-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['rehvo/tools/probe.txt', '.github/workflows/rehvo-probe.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p rehvo/tools/raw
          while read -r u; do
            [ -z "$u" ] && continue
            f=$(echo "$u" | sed 's#https\?://##; s#[^A-Za-z0-9._-]#_#g' | cut -c1-120)
            curl -sSL -A "Mozilla/5.0 (Rehvo catalog sync)" --max-time 60 -D "rehvo/tools/raw/$f.h" -o "rehvo/tools/raw/$f" -w "%{http_code} %{size_download} %{url_effective} $u\n" "$u" || echo "FAIL $u"
          done < rehvo/tools/probe.txt | tee rehvo/tools/raw/_status.txt
      - run: |
          git config user.name "rehvo-bot"; git config user.email "auppost@gmail.com"
          git pull -q --rebase origin main || true
          git add rehvo/tools/raw
          git diff --cached --quiet || (git commit -m "Rehvo: probe [skip ci]" && git push)
