# NS + HTTP watcher for nordvelg.com (v3)
name: nordvelg-ns
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/nordvelg-ns.yml', 'wrangler.jsonc', 'worker.js']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p nordvelg/tools
          {
            for d in nordvelg.com www.nordvelg.com; do
              echo "== $d"
              echo "NS:    $(dig +short NS $d @1.1.1.1 | sort | tr '\n' ' ')"
              echo "NS(8): $(dig +short NS $d @8.8.8.8 | sort | tr '\n' ' ')"
              echo "A:     $(dig +short A $d @1.1.1.1 | sort | tr '\n' ' ')"
            done
            echo "== registry (.com TLD)"
            dig +norec NS nordvelg.com @a.gtld-servers.net | grep -E 'IN\s+NS' | awk '{print $5}' | sort | tr '\n' ' '; echo
            echo "== dnssec"
            echo "DS at .com: $(dig +short DS nordvelg.com @a.gtld-servers.net | tr '\n' ' ')"
            echo "DNSKEY: $(dig +short DNSKEY nordvelg.com @elinore.ns.cloudflare.com | wc -l)"
            for r in 8.8.8.8 1.1.1.1 9.9.9.9 208.67.222.222; do echo "A via $r: $(dig +short A nordvelg.com @$r | tr '\n' ' ') status=$(dig A nordvelg.com @$r | grep -o 'status: [A-Z]*')"; done
            echo "www via 8.8.8.8: $(dig +short A www.nordvelg.com @8.8.8.8 | tr '\n' ' ')"
            echo "== http"
            for u in https://nordvelg.com/ https://www.nordvelg.com/ https://nordvelg.com/et/ https://nordvelg.com/sitemap.xml http://nordvelg.com/ http://www.nordvelg.com/ https://jukamedia.com/ https://jukamedia.com/demo/kova/et/; do
              echo "$u -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 $u)"
            done
            echo "form copy: $(curl -s --max-time 20 https://nordvelg.com/et/ | grep -c 'fContact')"
            echo "model select: $(curl -s --max-time 20 https://nordvelg.com/en/ | grep -c 'fModelSel')  privacy: $(curl -s -o /dev/null -w '%{http_code}' https://nordvelg.com/privacy/)"
            echo "hero: $(curl -s --max-time 20 https://nordvelg.com/ | grep -o '<h1 class="rise">[^<]*')"
            echo "title: $(curl -s --max-time 20 https://nordvelg.com/ | grep -o '<title>[^<]*' | head -1)"
          } > nordvelg/tools/ns-status.txt
          cat nordvelg/tools/ns-status.txt
      - run: |
          git config user.name "nordvelg-bot"; git config user.email "auppost@gmail.com"
          git add nordvelg/tools/ns-status.txt
          git diff --cached --quiet && exit 0
          git commit -q -m "Nordvelg: NS status [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
