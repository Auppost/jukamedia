name: rehvo-feeds
# Фиды Merchant Center для rehvo.ee (ru с короткими ID и en) из русского фида сайта.
# Файлы: https://jukamedia.com/rehvo/feed/google-feed-ru.xml и google-feed-en.xml
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['rehvo/tools/build_feeds.py', '.github/workflows/rehvo-feeds.yml']
  schedule:
    - cron: '41 3 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 rehvo/tools/build_feeds.py
      - run: |
          git config user.name "rehvo-bot"; git config user.email "auppost@gmail.com"
          git add rehvo/feed
          git diff --cached --quiet && exit 0
          git commit -q -m "Rehvo: Merchant Center feeds"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
